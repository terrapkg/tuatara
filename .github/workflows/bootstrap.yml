name: Bootstrap Andaman and Subatomic
permissions:
  contents: read
  attestations: write
  artifact-metadata: write
  id-token: write
on:
  workflow_dispatch:

jobs:
  bootstrap:
    strategy:
      matrix:
        version: ["tumbleweed"]
        arch: ["x86_64", "aarch64"]
      fail-fast: true
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    container:
      image: registry.opensuse.org/opensuse/${{ matrix.version }}
      options: --cap-add=SYS_ADMIN --privileged
    steps:
      - name: Install repositories
        run: |
          echo '#!/bin/sh' >> /usr/local/bin/zy
          echo 'env ZYPP_PCK_PRELOAD=1 ZYPP_CURL2=1 zypper $@' >> /usr/local/bin/zy
          cat<<EOF > /etc/zypp/zypper.conf
          [download]
          max_concurrent_connections = 100

          [solver]
          installRecommends = no

          [commit]
          autoAgreeWithLicenses = yes
          EOF

          zy install -y --setopt=install_weak_deps=False curl wget git-core openssl-devel cargo podman fuse-overlayfs rpmbuild script

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Build anda-srpm-macros
        run: |
          mkdir -p anda-build/rpm/rpms
          rpmbuild -bb tuatara/srpm-macros/*.spec --undefine=_disable_source_fetch -D "_sourcedir $(pwd)/anda/tuatara/srpm-macros/" -D "_rpmdir $(pwd)/anda-build/rpm/rpms/"
          mv ./anda-build/rpm/rpms/*/anda-*.rpm ./anda-build/rpm/rpms/
          zy install -y ./anda-build/rpm/rpms/anda-*.rpm

      - name: Install build dependencies
        run: |
          zy install -y $(rpmspec -q tuatara/*/*.spec --buildrequires)

      - name: Install Anda
        run: |
          rpmbuild -bb tuatara/anda/*.spec --undefine=_disable_source_fetch -D "_sourcedir $(pwd)/tuatara/anda/" -D "_rpmdir $(pwd)/anda-build/rpm/rpms/"
          mv ./anda-build/rpm/rpms/*/anda-*.rpm ./anda-build/rpm/rpms/
          zy install -y ./anda-build/rpm/rpms/anda-*.rpm

      - name: Build tuatara-mock-configs
        run: |
          echo "PATH=$PATH:/github/home/.cargo/bin" >> $GITHUB_ENV
          export PATH=$PATH:/github/home/.cargo/bin
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          anda build -D "vendor Tuatara" -rrpmbuild tuatara/mock-configs
      - name: Install tuatara-mock-configs
        run: zy install -y anda-build/rpm/rpms/tuatara-mock-configs*.rpm

      - name: Build tuatara-release
        run: anda build -D "vendor Tuatara" -rrpmbuild tuatara/release

      - name: Build tuatara-appstream-helper
        run: anda build -D "vendor Tuatara" -D "__python %{__python3}" -rrpmbuild tuatara/appstream-helper

      - name: Build Subatomic
        run: anda build -D "vendor Tuatara" -rrpmbuild tuatara/subatomic
      - name: Install Subatomic
        run: zy install -y ./anda-build/rpm/rpms/subatomic-*.rpm

      - name: Tidy up output directory
        run: rmdir anda-build/rpm/rpms/{noarch,aarch64,x86_64} | true

      - name: Upload packages to subatomic
        run: |
          subatomic-cli upload --prune \
            --server https://subatomic.fyralabs.com \
            --token ${{ secrets.SUBATOMIC_TOKEN }} \
            tuatara${{ matrix.version }} anda-build/rpm/rpms/*

      - name: Upload source packages to subatomic
        if: github.event_name == 'push'
        run: |
          subatomic-cli upload --prune \
            --server https://subatomic.fyralabs.com \
            --token ${{ secrets.SUBATOMIC_TOKEN }} \
            tuatara-${{ matrix.version }}-source anda-build/rpm/srpm/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            anda-build/rpm/rpms/*
            anda-build/rpm/srpm/*
